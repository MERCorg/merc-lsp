[package]
name = "merc-lsp"
version = "2.0.0"
edition = "2024"
license = "BSL-1.0"
rust-version = "1.93.1"

[[bin]]
name = "merc-lsp"
path = "src/main.rs"

[dependencies]
merc_syntax = { git = "https://github.com/mlaveaux/merc", rev = "1fc16721d23c527a46c3cd18d0ae76e6e59c51f1" }
merc_typecheck = { git = "https://github.com/mlaveaux/merc", rev = "1fc16721d23c527a46c3cd18d0ae76e6e59c51f1" }
merc_utilities = { git = "https://github.com/mlaveaux/merc", rev = "1fc16721d23c527a46c3cd18d0ae76e6e59c51f1" }
pest = "2.9"
async-lsp = { version = "0.2", features = ["tokio"] }
lsp-types = "0.95"
tower = "0.5"
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }
dashmap = "6.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "time"] }
serde_json = "1.0"
indoc = "2.0"
tempfile = "3.27"
