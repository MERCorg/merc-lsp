[package]
name = "merc-lsp"
version = "2.0.0"
edition = "2024"
license = "BSL-1.0"
rust-version = "1.93.1"

[[bin]]
name = "merc-lsp"
path = "src/main.rs"

[dependencies]
merc_syntax = { git = "https://github.com/MERCorg/merc" }
merc_utilities = { git = "https://github.com/MERCorg/merc" }
pest = "2.9"
tower-lsp = "0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
dashmap = "6.2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "time"] }
serde_json = "1"
indoc = "2"
tower = "0.4"
futures = "0.3"
