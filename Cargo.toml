[package]
name = "merc-lsp"
version = "2.0.0"
edition = "2024"
license = "BSL-1.0"
rust-version = "1.93.1"

[[bin]]
name = "merc-lsp"
path = "src/main.rs"

[features]
default = ["lsp-extensions"]
# Non-standard LSP protocol extensions on top of plain LSP: `merc/virtualDocument`
# (`src/virtual_document.rs`), `merc/generateFullSpec` (`src/generate.rs`), and
# `merc/didFocusTextDocument` (`src/focus.rs`). See README.md's "What's specific to the VS Code
# extension" section for what each does. On by default; disable (`--no-default-features`) to build
# a server that only ever speaks plain, spec-compliant LSP.
lsp-extensions = []

[dependencies]
merc_syntax = { git = "https://github.com/mlaveaux/merc", rev = "4366291ecca5c4b60a02100cfc456aabacf86ecb" }
merc_typecheck = { git = "https://github.com/mlaveaux/merc", rev = "4366291ecca5c4b60a02100cfc456aabacf86ecb" }
merc_utilities = { git = "https://github.com/mlaveaux/merc", rev = "4366291ecca5c4b60a02100cfc456aabacf86ecb" }
pest = "2.9"
async-lsp = { version = "0.2", features = ["tokio"] }
lsp-types = "0.95"
tower = "0.5"
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }
dashmap = "6.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
strsim = "0.11"
percent-encoding = "2.3"
line-index = "0.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "time"] }
serde_json = "1.0"
indoc = "2.0"
tempfile = "3.27"
