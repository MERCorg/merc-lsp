[package]
name = "merc-lsp"
version = "2.0.0"
edition = "2024"
license = "BSL-1.0"
rust-version = "1.93.1"

[[bin]]
name = "merc-lsp"
path = "src/main.rs"

[dependencies]
merc_syntax = { git = "https://github.com/MERCorg/merc" }
merc_typecheck = { git = "https://github.com/MERCorg/merc" }
merc_utilities = { git = "https://github.com/MERCorg/merc" }
pest = "2.9"
async-lsp = { version = "0.2", features = ["tokio"] }
lsp-types = "0.95"
tower = "0.5"
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std"] }
tokio-util = { version = "0.7", features = ["compat"] }
dashmap = "6.2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio = { version = "1.53", features = ["io-util", "time"] }
serde_json = "1"
indoc = "2"

# Points the git dependencies above at the local `~/merc` checkout (branch `feature/lsp-support`)
# instead of the published/pinned revision, for developing against upstream changes that haven't
# landed on `main` yet — the whole-process type checker, `TypingInfo`, and the precise
# per-identifier declaration/`Assignment` spans this crate's `symbols`/`semantic_tokens` now rely
# on. Remove once that branch merges and `Cargo.lock` is updated to pin the merged revision.
[patch."https://github.com/MERCorg/merc"]
merc_syntax = { git = "https://github.com/mlaveaux/merc", branch = "feature/lsp-support" }
merc_typecheck = { git = "https://github.com/mlaveaux/merc", branch = "feature/lsp-support" }
merc_utilities = { git = "https://github.com/mlaveaux/merc", branch = "feature/lsp-support" }
